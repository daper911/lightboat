# Lightboat Windows build, adapted from FlClash's own build.yaml (desktop +
# release jobs); first passed unchanged on 2026-10-04 (milestone W0).
# See docs/lightboat/windows/W4-build-and-ci.md.
name: lightboat-windows

on:
  push:
    # `windows` is the Windows milestone branch: every push gets a test build.
    branches: [main, windows]
    paths:
      - 'lib/**'
      - 'windows/**'
      - 'core/**'
      - 'plugins/**'
      - 'services/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'setup.dart'
      - 'build_config.yaml'
      - 'arb/**'
      - '.github/workflows/lightboat-windows.yml'
    tags:
      - 'lb-v*'
  workflow_dispatch:

# A newer push supersedes a running build of the same ref; tagged releases always finish.
concurrency:
  group: lightboat-windows-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # Keep in step with FlClash's build.yaml when merging upstream.
  FLUTTER_VERSION: '3.47.4'
  GO_VERSION: '1.26.4'

jobs:
  build:
    name: Windows amd64
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Enable git long paths
        run: git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      # Rust itself is preinstalled on the runner; this caches the helper service
      # and rust_api builds between runs.
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: lightboat-windows-amd64
          workspaces: |
            services/helper
            plugins/rust_api/rust
          cache-directories: .dart_tool/hooks_runner

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get dependencies
        run: |
          flutter --version
          flutter pub get

      - name: Analyze
        run: flutter analyze

      # Builds the core, helper service and app, then packages dist/*.exe (Inno
      # Setup, preinstalled on the runner) and dist/*.zip.
      # A hang here fails on its own with logs, before the 60-minute job
      # limit or a lost runner leaves nothing to read (run 37371677498).
      - name: Build and package
        timeout-minutes: 40
        run: dart setup.dart windows -v

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -File -Include *.exe,*.zip -Recurse |
            ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } |
            Set-Content -Encoding ascii dist/SHA256SUMS
          Get-Content dist/SHA256SUMS

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lightboat-windows-${{ github.ref_name }}-${{ github.run_number }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS
          retention-days: 14
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/lb-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # The Android APKs are built locally and attached to the same release by hand.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: 轻舟 ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*
